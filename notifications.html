<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notification Page</title>
    <link rel="stylesheet" href="notifications.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <script src="language.js" defer></script>
  </head>
  <body>
    <div id="loading-screen">
      <div class="spinner"></div>
    </div>
    <div id="main-content" style="display: none">
      <div class="container">
        <nav class="sidebar">
          <ul>
            <!-- <li>
        <a href="index.html"><i class="fas fa-home"></i> Home</a>
      </li> -->
            <li>
              <a href="flights.html"
                ><i class="fas fa-plane"></i>
                <p id="navFlights">Flights</p></a
              >
              <ul>
                <li><a href="#">Upcoming Flights</a></li>
                <li><a href="#">Cancelled Flights</a></li>
                <li><a href="#">Rescheduled Flights</a></li>
              </ul>
            </li>
            <li>
              <a href="tickets.html"
                ><i class="fas fa-ticket-alt"></i>
                <p id="navTickets">Tickets</p></a
              >
            </li>
            <li>
              <a href="travelers.html"
                ><i class="fas fa-users"></i>
                <p id="navTravelers">Travelers</p></a
              >
            </li>
            <li>
              <a href="notifications.html"
                ><i class="fas fa-bell"></i>
                <p id="navNotifications">Notifications</p></a
              >
            </li>
            <li>
              <a href="reports.html"
                ><i class="fas fa-chart-line"></i>
                <p id="navReports">Reports</p></a
              >
            </li>
            <li>
              <a href="help.html"
                ><i class="fas fa-question-circle"></i>
                <p id="navHelp">Help Center</p></a
              >
            </li>
            <li>
              <a href="settings.html"
                ><i class="fas fa-cog"></i>
                <p id="navSettings">Settings</p></a
              >
            </li>
            <li>
              <a href="home.html"
                ><i class="fas fa-user"></i>
                <p id="dashboard">Dashboard</p></a
              >
            </li>
          </ul>
        </nav>
        <div class="ncontainer">
          <div class="info-box">
            <h3 class="dashboard">Notification</h3>
            <div class="good">
              <p id="goodday" id="good"></p>

              <i class="fas fa-user" style="margin-left: 20px"></i>
            </div>
          </div>

          <div class="notification-container">
            <h2>Send Notifications</h2>

            <!-- Form for selecting ID -->
            <form id="notification-form">
              <label for="id-select">Select Traveler ID:</label>
              <select id="id-select" required>
                <!-- Options will be dynamically populated -->
              </select>

              <label for="message">Message:</label>
              <textarea
                id="message"
                placeholder="Type your message here..."
                required
              ></textarea>

              <div class="actions">
                <button type="button" id="send-email">Send Email</button>
                <button type="button" id="send-sms">Send SMS</button>
              </div>
            </form>

            <div id="notification-response"></div>
          </div>
        </div>
      </div>
    </div>
    <script src="notification.js"></script>
  </body>
</html>
