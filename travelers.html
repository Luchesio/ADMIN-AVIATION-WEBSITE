<html lang="en">
  <head>
    <meta charset="UTF-8" />

      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <script src="language.js" defer></script>
  </head>
  <body>
    <div id="loading-screen">
      <div class="spinner"></div>
    </div>
    <div id="main-content" style="display: none">
      <div class="container">
        <nav class="sidebar">
          <ul>
            <!-- <li>
        <a href="index.html"><i class="fas fa-home"></i> Home</a>
      </li> -->
            <li>
              <a href="flights.html"
                ><i class="fas fa-plane"></i>
                <p id="navFlights">Flights</p></a
              >
              <ul>
                <li><a href="#">Upcoming Flights</a></li>
                <li><a href="#">Cancelled Flights</a></li>
                <li><a href="#">Rescheduled Flights</a></li>
              </ul>
            </li>
            <li>
              <a href="tickets.html"
                ><i class="fas fa-ticket-alt"></i>
                <p id="navTickets">Tickets</p></a
              >
            </li>
            <li>
              <a href="travelers.html"
                ><i class="fas fa-users"></i>
                <p id="navTravelers">Travelers</p></a
              >
            </li>
            <li>
              <a href="notifications.html"
                ><i class="fas fa-bell"></i>
                <p id="navNotifications">Notifications</p></a
              >
            </li>
            <li>
              <a href="reports.html"
                ><i class="fas fa-chart-line"></i>
                <p id="navReports">Reports</p></a
              >
            </li>
            <li>
              <a href="help.html"
                ><i class="fas fa-question-circle"></i>
                <p id="navHelp">Help Center</p></a
              >
            </li>
            <li>
              <a href="settings.html"
                ><i class="fas fa-cog"></i>
                <p id="navSettings">Settings</p></a
              >
            </li>
            <li>
              <a href="home.html"
                ><i class="fas fa-user"></i>
                <p id="dashboard">Dashboard</p></a
              >
            </li>
          </ul>
        </nav>

        <!-- <h2>Traveler Information</h2> -->
        <div class="trcontainer">
          <div class="info-box">
            <h3 class="dashboard">Customers</h3>
            <div class="good">
              <p id="goodday" id="good"></p>

              <i class="fas fa-user" style="margin-left: 20px"></i>
            </div>
          </div>
          <table id="traveler-table">
            <thead>
              <tr>
                <th>Traveler ID</th>
                <th>Name</th>
                <th>Phone Number</th>
                <th>Email</th>
              </tr>
            </thead>
            <tbody>
              <!-- Data rows will be inserted dynamically here -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <script>
      // scripts.js

      // Fetch stored traveler data from localStorage
      let travelers = JSON.parse(localStorage.getItem("travelers")) || [];

      // Reference to the table body
      const tableBody = document.querySelector("#traveler-table tbody");

      // Populate the table with traveler data
      travelers.forEach((traveler) => {
        const row = document.createElement("tr");

        // Create table cells for each piece of traveler information
        const idCell = document.createElement("td");
        idCell.textContent = traveler.id;

        const nameCell = document.createElement("td");
        nameCell.textContent = traveler.name;

        const phoneCell = document.createElement("td");
        phoneCell.textContent = traveler.phone;

        const emailCell = document.createElement("td");
        emailCell.textContent = traveler.email;

        // Append the cells to the row
        row.appendChild(idCell);
        row.appendChild(nameCell);
        row.appendChild(phoneCell);
        row.appendChild(emailCell);

        // Append the row to the table body
        tableBody.appendChild(row);
      });
    </script>
    <script src="travelers.js"></script>
  </body>
</html>
